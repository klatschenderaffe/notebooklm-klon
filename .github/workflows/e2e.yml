name: E2E Tests

# Läuft gegen die echte, live deployte Staging-Umgebung (Frontend auf Cloudflare Workers,
# das gegen das echte Render-Staging-Backend und ein echtes Supabase-Staging-Projekt spricht).
# Ein grüner Lauf ist damit ein echter Beweis, dass die komplette Staging-Kette online ist.
# Bewusst NICHT bei jedem Push/PR, sondern manuell auslösbar + wöchentlich als Regressions-Check.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # jeden Montag 04:00 UTC

jobs:
  e2e:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: E2E-Dependencies installieren
        working-directory: e2e
        run: npm ci

      - name: Playwright-Browser installieren
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Playwright-Tests ausführen
        working-directory: e2e
        env:
          E2E_BASE_URL: https://notebooklm-klon-staging.piaheiss.workers.dev
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
